[project]
name = "fdc-enrich"
version = "0.1.0"
description = "USDA FoodData Central generic-food ingestion + LLM enrichment pipeline (marimo + DuckDB + OpenRouter)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "marimo>=0.13",
    "openai>=1.40",
    "polars>=1.5",
    "pyarrow>=17",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.marimo.runtime]
# Reload edited src/ modules in place; cells that use them go stale so you
# click to re-run instead of auto-firing the gated pipeline stages.
auto_reload = "lazy"
