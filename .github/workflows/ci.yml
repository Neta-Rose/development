name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless; keep the newest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `stable`: CLAUDE.md documents Flutter 3.44, vercel.json pins
      # 3.44.6, and Shorebird patches are only valid against the Flutter revision their
      # release was built with. A floating version here would drift away from both.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # No build_runner step: all 14 *.g.dart / *.freezed.dart files are committed, so
      # `flutter analyze` already fails if a generated file is stale.
      #
      # Runs from the repo root deliberately — test/catalog_test.dart attaches the real
      # 21 MB database/foods.sqlite by *relative* path, so any working-directory here
      # breaks it. The catalog is a plain tracked blob, not Git LFS, so the default
      # checkout above is enough.
      - run: flutter test

  # A debug APK is the cheapest thing that actually exercises the Android Gradle
  # configuration — and Gradle configures every build type regardless of which one it is
  # building, so this compiles the release signingConfigs block too. Without it, a mistake in
  # android/app/build.gradle.kts surfaces only inside the manually-triggered release workflow,
  # after Shorebird has already spent several minutes.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug on purpose: key.properties is absent here, so the release build type falls back
      # to debug keys. This checks the configuration, not the signature.
      - run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.mod

      # The check triple from server/README.md. gofmt exits 0 whether or not it found
      # anything, so the output has to be the assertion.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # Fully offline: the tests stub OpenRouter with httptest, so no key is needed.
      - run: go test ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: fmt
        run: terraform fmt -check -recursive -diff infra/

      # -backend=false so this needs no GCP credentials at all. That is the reason the
      # deploy service account's trust policy excludes pull requests: a PR can be validated without
      # ever being able to reach GCP.
      - name: validate
        run: |
          for dir in infra/terraform/*/; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
