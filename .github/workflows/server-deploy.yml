name: Deploy server

# Builds server/ into a container image, pushes it to GCP Artifact Registry, and applies the Terraform
# app stack against that exact image tag on GCP Cloud Run.
#
# Pull requests are not handled here on purpose: they get `terraform validate` in ci.yml,
# which needs no credentials. The deploy service account trust policy admits only refs/heads/main, so
# a PR cannot reach GCP even if a workflow file in it asks to.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'infra/terraform/app/**'
      - '.github/workflows/server-deploy.yml'
  workflow_dispatch:

# Two applies racing on one state file would just fight over the lock.
concurrency:
  group: server-deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC: Workload Identity Federation authentication
  contents: read

env:
  TERRAFORM_VERSION: 1.14.3
  GCP_REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Re-run the server's own checks before shipping. They are offline and take seconds,
      # and a workflow_dispatch can otherwise deploy a commit CI never saw.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.mod

      - name: Test
        working-directory: server
        run: go vet ./... && go test ./...

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/healthapp-plated/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Terraform init
        working-directory: infra/terraform/app
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.GCP_TF_STATE_BUCKET }}"

      - name: Terraform apply
        working-directory: infra/terraform/app
        env:
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ env.GCP_REGION }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          TF_VAR_plate_api_token: ${{ secrets.PLATE_API_TOKEN }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      # Proves the deploy is actually serving, not merely that the API calls returned.
      # /healthz answers 200 even unconfigured, so the assertion is on the body: configured
      # false here means detection credentials are missing from the environment.
      - name: Smoke test
        working-directory: infra/terraform/app
        run: |
          set -euo pipefail
          url=$(terraform output -raw cloud_run_url)
          echo "endpoint: $url"

          body=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 3 "${url%/}/healthz")
          echo "$body"

          if ! grep -q '"status":"ok"' <<<"$body"; then
            echo "::error::/healthz did not report ok"
            exit 1
          fi
          if ! grep -q '"configured":true' <<<"$body"; then
            echo "::error::server reports configured=false — detection credentials are missing"
            echo "::error::from the Cloud Run environment. Detection will return 503 not_configured."
            exit 1
          fi

          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| endpoint | \`${url%/}\` |"
            echo "| image tag | \`${{ github.sha }}\` |"
            echo ""
            echo "\`$body\`"
          } >> "$GITHUB_STEP_SUMMARY"
